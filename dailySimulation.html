<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Daily Schedule Simulation</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 60px; background-color: #eef;">

  <h1>My Simulated Day</h1>
  <div id="output" style="margin-top: 40px; font-size: 1.5rem;"></div>

  <script>
    const output = document.getElementById("output");

    const moods = ["😊", "😴", "😅", "🥱", "😌", "🤩"];

    function randomMood() {
    return moods[Math.floor(Math.random() * moods.length)];
    }

    setTimeout(() => {
    output.textContent = `7:00 AM - Waking up, stretching, and reading ${randomMood()}`;
    }, 1000);

    setTimeout(() => {
    output.textContent = `7:30 AM - Making coffee, and getting ready for the day ${randomMood()}`;
    }, 2500);

    setTimeout(() => {
    output.textContent = `9:00 AM - Starting work, checking emails, and planning tasks ${randomMood()}`;
    }, 4000);

    setTimeout(() => {
    output.textContent = `12:00 PM - Lunch break ${randomMood()}`;
    }, 5500);

    setTimeout(() => {
    output.textContent = `3:00 PM - Walking outside with my dog for a break ${randomMood()}`;
    }, 7000);

    setTimeout(() => {
    output.textContent = `8:00 PM - Winding down with a show ${randomMood()}`;
    }, 8500);
  </script>

</body>
</html>
